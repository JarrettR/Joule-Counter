# Power Profiler Kit II firmware.
#
# The board supplies the LFCLK source, the bootloader-aware flash offset and
# the USB stack selection; this file asks for what the application uses.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Cortex-M4F: calibration maths and voltage conversion are floating point.
CONFIG_FPU=y

# The SAADC END handler runs as a zero-latency interrupt: it has 10 us to
# collect each result and must not wait behind irq_lock() sections in the USB
# driver. It makes no kernel calls; a TIMER3 compare interrupt signals blocks.
CONFIG_ZERO_LATENCY_IRQS=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_CRC=y

# The metadata reply and the shell print floats with printf-style formatting.
CONFIG_PICOLIBC_IO_FLOAT=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# USB: this application builds its own composite device (data port, shell
# port, DFU trigger), so the board's boot-time CDC ACM convenience must stay
# out of the way.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# Sample blocks are 2128-byte bulk transfers (512 packed samples plus a
# header); several are in flight at once and the pool needs headroom beyond
# them for the metadata reply and the control/RX buffers, or allocations
# fail under load.
CONFIG_UDC_BUF_POOL_SIZE=16384
CONFIG_UDC_BUF_COUNT=32

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_PROMPT_UART="ppk2:~$ "

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192
